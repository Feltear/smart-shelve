<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab-Usine - Étagère</title>
  </head>
  <body>
    <a href="https://lab-usine.ulaval.ca/" target="_blank">
      <img src="./cropped-Lab-Usine-jaune-TxB.png" class="logo" alt="Lab-Usine logo" />
    </a>
    <h1>Étagère intelligente</h1>
    <button id="reload-config-btn">Mettre à jour la configuration</button>
    <div id="tables-container">
      <h3>Définition de l'étagère</h3>
      <table id="shelf-table">
        <thead>
          <tr>
            <th>Largeur</th>
            <th>Hauteur</th>
            <th>Profondeur</th>
          </tr>
        </thead>
        <tbody>
          <tr id="shelf-row">
            <td id="shelf-width">-</td>
            <td id="shelf-height">-</td>
            <td id="shelf-depth">-</td>
          </tr>
        </tbody>
      </table>
    
      <h3>Inventaire</h3>
      <button id="save-btn">Mise à zéro</button>
      <div id="tables-container">
        <table id="products-table">
          <thead>
            <tr>
              <th>Nom</th>
              <th>Largeur</th>
              <th>Hauteur</th>
              <th>Épaisseur</th>
              <th>Quantité</th>
            </tr>
          </thead>
          <tbody id="products-body">
          </tbody>
        </table>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
